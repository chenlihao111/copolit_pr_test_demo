name: PR Agent

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:

jobs:
  pr_agent_job:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: write
    steps:
      - name: PR Agent
        uses: the-pr-agent/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEEPSEEK.KEY: ${{ secrets.DEEPSEEK_KEY }}
          config.model: "deepseek/deepseek-v4-pro"
          config.fallback_models: '["deepseek/deepseek-v4-flash"]'
          pr_reviewer.extra_instructions: "分析本次改动对 main 分支中其他代码的影响，重点检查调用方、接口或返回值契约、错误处理和受影响的测试。"
